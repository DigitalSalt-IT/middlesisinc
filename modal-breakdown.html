<!-- Add this modal HTML before closing container -->
<div id="breakdownModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; overflow: auto;">
    <div style="background: white; margin: 50px auto; max-width: 900px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
        <div style="background: linear-gradient(135deg, #6BA3C8 0%, #4A7B9D 100%); padding: 20px 30px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center;">
            <h2 id="modalTitle" style="color: white; margin: 0; font-size: 22px;"></h2>
            <button onclick="closeBreakdownModal()" style="background: none; border: none; color: white; font-size: 30px; cursor: pointer; padding: 0; line-height: 1;">&times;</button>
        </div>
        <div style="padding: 30px;">
            <div id="modalContent"></div>
        </div>
    </div>
</div>
